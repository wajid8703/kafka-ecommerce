name: Deploy to Development

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - shipping-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying to development environment..."
          echo "Image: ${{ env.IMAGE_PREFIX }}/order-service:latest"
          # In production, you would:
          # - SSH to server
          # - Pull new images
          # - Run docker-compose up -d

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add your smoke tests here
          # curl http://dev-server:8081/health

      - name: Notify deployment
        run: |
          echo "✅ Deployment to Dev successful!"
          echo "Services deployed: order, inventory, payment, shipping, notification, analytics"

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send Slack notification
        if: success()
        run: |
          echo "Would send Slack notification: Deployment succeeded ✅"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Dev deployment successful!"}'

      - name: Send failure notification
        if: failure()
        run: |
          echo "Would send Slack notification: Deployment failed ❌"