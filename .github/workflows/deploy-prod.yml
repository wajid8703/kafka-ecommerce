name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  deploy-approval:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-production-url.com

    steps:
      - name: Manual approval checkpoint
        run: |
          echo "🔒 Production deployment requires manual approval"
          echo "Version: ${{ github.event.release.tag_name || inputs.version }}"

  build-and-push:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: deploy-approval

    strategy:
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - shipping-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=${{ github.event.release.tag_name || inputs.version }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          VERSION=${{ github.event.release.tag_name || inputs.version }}
          echo "Version: $VERSION"
          
          # In real scenario:
          # - SSH to production servers
          # - Update kubernetes manifests
          # - Or trigger AWS ECS update
          # - Or use terraform apply

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          # curl https://api.production.com/health
          # Run critical path tests

      - name: Create deployment record
        run: |
          echo "📝 Recording deployment..."
          echo "Version: ${{ github.event.release.tag_name || inputs.version }}"
          echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Commit: ${{ github.sha }}"

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()

    steps:
      - name: Rollback deployment
        run: |
          echo "❌ Deployment failed! Rolling back..."
          # Rollback to previous version
          # kubectl rollout undo deployment/order-service

      - name: Notify failure
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT FAILED - ROLLED BACK"
          # Send urgent notification